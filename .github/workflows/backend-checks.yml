name: Backend checks
on:
  workflow_call:
  pull_request:
    paths: ["server/**", ".github/workflows/backend-checks.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: live_link_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test-password@127.0.0.1:5432/live_link_test
      TEST_DATABASE_URL: postgresql://postgres:test-password@127.0.0.1:5432/live_link_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: server/.node-version
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run audit
